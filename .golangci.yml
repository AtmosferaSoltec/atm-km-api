# golangci-lint v2. The deploy's check runs it with this same configuration:
# a lint error stops the deploy.
version: "2"

linters:
  # The usual ones (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - rowserrcheck
    - sqlclosecheck
  settings:
    depguard:
      rules:
        # Dependency rule 1. Rule 2 (a module does not import another module's
        # inner packages) is checked by internal/archtest.
        domain:
          files:
            - "**/internal/modules/*/domain/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: domain must stay plain Go
            - pkg: github.com/jackc/pgx
              desc: domain must stay plain Go
            - pkg: net/http
              desc: domain must stay plain Go
            - pkg: database/sql
              desc: domain must stay plain Go
  exclusions:
    paths:
      # Generated by sqlc.
      - internal/modules/.*/adapters/postgres/sqlcgen
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
