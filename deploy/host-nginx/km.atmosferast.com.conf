# /etc/nginx/sites-available/km.atmosferast.com (host nginx). Ports: km-web 3150, km-api 3151.
server {
	listen 80;
	listen [::]:80;
	server_name km.atmosferast.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name km.atmosferast.com;

	ssl_certificate     /etc/ssl/atmosferast/origin.pem;
	ssl_certificate_key /etc/ssl/atmosferast/origin.key;

	# Odometer photos are uploaded through the API.
	client_max_body_size 15m;

	# API (km-api). The session cookie is SameSite=Strict, so web and API share
	# this origin. The client IP comes from Cloudflare (conf.d/auth-client-ip.conf).
	location /api/ {
		proxy_pass http://127.0.0.1:3151;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $auth_client_ip;
		proxy_set_header X-Forwarded-For $auth_client_ip;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;
	}

	# Web (km-web): static SPA.
	location / {
		proxy_pass http://127.0.0.1:3150;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
