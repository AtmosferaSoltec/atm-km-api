# sqlc generates typed Go code from real SQL. One entry per module, generating
# inside the module itself. Each entry reads only its own module's migrations,
# so it only generates models for the tables it owns.
#
#   sqlc generate -f db/sqlc.yaml
version: "2"

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      # DATE: midnight UTC in a time.Time (see platform/dates).
      - db_type: date
        go_type: time.Time
      - db_type: date
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: pg_catalog.numeric
        go_type: github.com/shopspring/decimal.Decimal
      - db_type: pg_catalog.numeric
        nullable: true
        go_type:
          import: github.com/shopspring/decimal
          type: Decimal
          pointer: true

sql:
  - engine: postgresql
    schema: migrations/00001_identity_create_users_and_sessions.sql
    queries: ../internal/modules/identity/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/identity/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true

  - engine: postgresql
    schema:
      - migrations/00001_identity_create_users_and_sessions.sql
      - migrations/00002_settings_create_user_settings.sql
      - migrations/00008_settings_drop_car_and_borrower_names.sql
    queries: ../internal/modules/settings/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/settings/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true

  - engine: postgresql
    schema:
      - migrations/00001_identity_create_users_and_sessions.sql
      - migrations/00003_trips_create_trips_and_photos.sql
      - migrations/00006_trips_create_vouchers.sql
    queries: ../internal/modules/trips/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/trips/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true

  - engine: postgresql
    schema:
      - migrations/00001_identity_create_users_and_sessions.sql
      - migrations/00004_fuel_create_fuel_logs.sql
      - migrations/00005_fuel_add_price_per_gallon.sql
      - migrations/00007_fuel_add_receipt_photo.sql
    queries: ../internal/modules/fuel/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/fuel/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
